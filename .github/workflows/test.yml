name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift build
      - name: swift test
        run: |
          set -o pipefail
          swift test 2>&1 | tee test.log || {
            # 로그인 없이도 보이게 실패 줄을 annotation으로
            grep -E "error:|failed \\(" test.log | head -20 | while read -r line; do echo "::error::$line"; done
            exit 1
          }
      - run: swift build -c release
