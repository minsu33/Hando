name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: swift test
        run: |
          set -o pipefail
          swift test 2>&1 | tee test.log || {
            # 로그인 없이도 보이게 실패 줄을 annotation으로
            grep -E "error:|failed \\(" test.log | head -20 | while read -r line; do echo "::error::$line"; done
            exit 1
          }
      - name: build zip
        run: VERSION="${GITHUB_REF_NAME}" ./scripts/build-app.sh --zip
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" "dist/Hando-$VERSION.zip" "dist/Hando-$VERSION.zip.sha256" \
            --title "Hando $VERSION" --generate-notes
