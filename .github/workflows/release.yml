name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test
      - name: build zip
        run: VERSION="${GITHUB_REF_NAME}" ./scripts/build-app.sh --zip
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" "dist/Hando-$VERSION.zip" "dist/Hando-$VERSION.zip.sha256" \
            --title "Hando $VERSION" --generate-notes
